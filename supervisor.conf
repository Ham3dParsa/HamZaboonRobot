[unix_http_server]
file=/var/run/supervisor.sock

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
nodaemon=false

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xray]
command=/usr/local/bin/xray run -c /app/hamzaban/.xray/config.json
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
redirect_stderr=true
stdout_logfile=/var/log/xray/xray.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:hamzaban]
command=/usr/local/bin/python3 /app/hamzaban/bot.py
directory=/app/hamzaban
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
redirect_stderr=true
stdout_logfile=/app/hamzaban/bot.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
