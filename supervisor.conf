[program:xray]
command=/usr/local/bin/xray run -c /var/lib/xray/config.json
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
redirect_stderr=true
stdout_logfile=/var/lib/xray/xray.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
logfile_maxbytes=10MB

[program:hamzaban]
command=/usr/local/bin/python3 /app/hamzaban/bot.py
directory=/app/hamzaban
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
redirect_stderr=true
stdout_logfile=/app/hamzaban/bot.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
