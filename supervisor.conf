# Xray-only supervisor config. The bot itself is started and supervised by
# the platform via start.sh (live log: "Found custom start.sh script"), so no
# [program:hamzaban] here — it would spawn a twin poller (Telegram 409).
[unix_http_server]
file=/var/run/supervisor.sock

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
nodaemon=false

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xray]
command=/usr/local/bin/xray run -c /app/hamzaban/.xray/config.json
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
redirect_stderr=true
stdout_logfile=/var/log/xray/xray.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
