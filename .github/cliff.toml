# git-cliff changelog generator configuration.
# Generate with: git cliff -o CHANGELOG.md
# Verify in CI: scripts/generate_changelog.py --check

[changelog]
trim = true
header = """
# Changelog

All notable changes to HamZaboon. Generated automatically from
[Conventional Commits](https://www.conventionalcommits.org/) by
[git-cliff](https://git-cliff.org). Do not edit by hand.
"""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits -%}
- {{ commit.message | upper_first }}{% if commit.scope %} (`{{ commit.scope }}`){% endif %}{% if commit.breaking %} 🔥{% endif %}
{% endfor -%}
{% endfor -%}
"""
footer = """
---

This changelog is generated automatically. Manual edits will be overwritten.
"""
postprocessors = []
sort_commits = "oldest"

[git]
conventional_commits = true
commit_parsers = [
  { message = "^feat:", group = "Features" },
  { message = "^fix:", group = "Bug Fixes" },
  { message = "^docs:", group = "Documentation" },
  { message = "^refactor:", group = "Refactoring" },
  { message = "^perf:", group = "Performance" },
  { message = "^test:", group = "Testing" },
  { message = "^build:", group = "Build" },
  { message = "^ci:", group = "Continuous Integration" },
  { message = "^chore:", group = "Chores" },
  { message = "^revert:", group = "Reverts" },
  { message = ".*", group = "Other" },
]
filter_commits = false