# git-cliff changelog generator configuration.
# Regenerate with: python scripts/generate_changelog.py
# (NOT CI-gated: git-cliff regenerates whole-history from HEAD, so a byte-exact
# gate false-fails after every commit until release tags exist. Run
# `python scripts/generate_changelog.py --check` locally before a release.)

[changelog]
trim = true
header = """
# Changelog

All notable changes to HamZaboon. Generated automatically from
[Conventional Commits](https://www.conventionalcommits.org/) by
[git-cliff](https://git-cliff.org). Do not edit by hand.
"""
body = """
{%- for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{%- for commit in commits %}
- {{ commit.message | upper_first }}{% if commit.scope %} (`{{ commit.scope }}`){% endif %}{% if commit.breaking %} 🔥{% endif %}
  — @{{ commit.author.name }}
{%- endfor -%}
{%- endfor -%}
"""
footer = """
---

This changelog is generated automatically. Manual edits will be overwritten.
"""
postprocessors = []
sort_commits = "newest"

[git]
conventional_commits = true
filter_unconventional = false
date_order = true
date_format = "%Y-%m-%d"
commit_parsers = [
  { message = "^feat:", group = "Features" },
  { message = "^fix:", group = "Bug Fixes" },
  { message = "^docs:", group = "Documentation" },
  { message = "^refactor:", group = "Refactoring" },
  { message = "^perf:", group = "Performance" },
  { message = "^test:", group = "Testing" },
  { message = "^build:", group = "Build" },
  { message = "^ci:", group = "Continuous Integration" },
  { message = "^chore:", group = "Chores" },
  { message = "^revert:", group = "Reverts" },
  { message = ".*", group = "Other" },
]
filter_commits = false

[git.url]
github = "https://github.com/Ham3dParsa/HamZaboonRobot"
