domain-bot:
  - any: ['bot.py', 'handlers/**/*', 'config/keyboards.py']

domain-handlers:
  - any: ['handlers/admin.py', 'handlers/admin_ai.py', 'handlers/admin_backup.py', 'handlers/admin_plans.py', 'handlers/admin_cost.py', 'handlers/study_handler.py', 'handlers/srs_handler.py', 'handlers/help_command.py', 'handlers/user.py', 'handlers/flows.py']

domain-ai:
  - any: ['services/ai/**/*']

domain-db:
  - any: ['services/db/**/*']

domain-session:
  - any: ['services/session/**/*']

domain-config:
  - any: ['config/**/*']

domain-factory:
  - any: ['factory/**/*', 'services/ai/preset_fields.py']

domain-tools:
  - any: ['tools/**/*']

domain-tests:
  - any: ['tests/**/*']

domain-docs:
  - any: ['docs/**/*', '**/*.md', '.opencode/**/*']

domain-deploy:
  - any: ['supervisor.conf', 'start.sh', 'chabok-pre-start.sh']

domain-ci:
  - any: ['.github/**/*', 'requirements.txt', 'requirements-dev.txt']

domain-utils:
  - any: ['services/utils/**/*']

domain-scheduling:
  - any: ['services/scheduling.py']

domain-tts:
  - any: ['services/tts.py', 'tts_cache/**/*']

domain-quota:
  - any: ['services/quota_service.py', 'services/grade_service.py']

domain-activity:
  - any: ['services/activity_log.py']

i18n:
  - any: ['services/utils/formatting.py', 'services/utils/formatting_jalali.py', 'config/catalog.py', 'config/themes.py']

UI/UX:
  - any: ['config/keyboards/**/*']

risk:
  - any: ['services/db/schema.py', 'migrations/**/*', 'services/db/**/*.py']
