name: Nightly load-sim (FULL volumes)

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  full-load-sim:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: FULL load-sim slices
        env:
          HAMZABAN_TEST_MODE: "1"
          HAMZABAN_LOAD_SIM_FULL: "1"
        run: python -m pytest tests/test_integration/test_load_sim_5k_flow.py tests/test_integration/test_load_sim_100_flow.py tests/test_load_sim_60day.py --durations=5 -v
