name: CI

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - requirements.txt
      - .github/workflows/*
      - scripts/*.py
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - requirements.txt
      - .github/workflows/*
      - scripts/*.py

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint with ruff
        run: python -m ruff check --select F821,F811

      - name: Check syntax with py_compile
        run: python scripts/compile_all.py

      - name: Test with pytest
        id: test
        continue-on-error: true
        env:
          HAMZABAN_TEST_MODE: "1"
        run: python -m pytest tests/ -n 4 --junitxml=junit/test-results.xml -v

      - name: Test factory scripts
        id: factory
        continue-on-error: true
        env:
          HAMZABAN_TEST_MODE: "1"
        run: python -m pytest tests/factory/ -n 4 --junitxml=junit/factory-results.xml -v

      - name: Check whitespace errors
        run: git diff --check

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always() && hashFiles('junit/test-results.xml') != ''
        continue-on-error: true
        with:
          name: Test Results (${{ matrix.python-version }})
          path: junit/test-results.xml,junit/factory-results.xml
          reporter: java-junit

      - name: Fail on test failure
        if: steps.test.outcome == 'failure' || steps.factory.outcome == 'failure'
        run: exit 1

  ram-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Assert peak RAM <= 2GB during full suite
        env:
          HAMZABAN_TEST_MODE: "1"
        run: python scripts/run_with_ram_gate.py -n 2

  review-context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install graphify (best-effort)
        run: pip install graphifyy || true

      - name: Build review context
        run: python scripts/review_blast_radius.py --base origin/main --out review-context.json || test $? -eq 2

      - name: Upload review context
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-context
          path: review-context.json
          if-no-files-found: warn
