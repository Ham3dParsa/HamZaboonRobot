name: Deploy to VPS

# Auto-redeploy on pushes to main (e.g. after a PR merge) and manual runs.
# Recommended approach from issue #490: no listener on the server, the workflow
# SSHes in and runs deploy/redeploy.sh (git pull + pip install + systemctl restart).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            bash /home/ubuntu/HamZaboonRobot/deploy/redeploy.sh
