<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گالری کارت‌ها — template خط لوله (v4 باریک وسط‌چین)</title>
<style>
/* GALLERY v4 (locked): narrow ~600px centered cards, faint topic/CEFR tags,
   centered word+IPA headers, centered example pairs, syn=green/ant=red text.
   TEMPLATE: sample data lives between GALLERY_DATA_START/END below.
   Regenerate: python -m factory.pipeline.render_gallery --data <rows.json> --out <run.html>
   (see factory/pipeline/README.md). Do NOT hand-edit the data block. */
:root {
  --font-sans: "Vazirmatn", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", Consolas, monospace;

  /* LIGHT THEME */
  --bg-page: #f4f5f8;
  --bg-surface: #ffffff;
  --bg-surface-hover: #f8f9fb;
  --bg-surface-active: #e9ecf2;
  --border-subtle: #e1e4eb;
  --border-strong: #c7cbd6;

  --text-primary: #12141a;
  --text-secondary: #484e5d;
  --text-muted: #858b99;

  --accent: #2563eb;
  --accent-soft: #eff6ff;

  --ok-text: #059669; --ok-bg: #ecfdf5; --ok-border: #a7f3d0;
  --bad-text: #dc2626; --bad-bg: #fef2f2; --bad-border: #fecaca;
  --warn-text: #d97706; --warn-bg: #fffbeb; --warn-border: #fde68a;
  --info-text: #0284c7; --info-bg: #f0f9ff; --info-border: #bae6fd;
  --purple-text: #7c3aed; --purple-bg: #f5f3ff; --purple-border: #ddd6fe;

  --cefr-a: #059669; --cefr-a-bg: #ecfdf5;
  --cefr-b: #0284c7; --cefr-b-bg: #f0f9ff;
  --cefr-c: #7c3aed; --cefr-c-bg: #f5f3ff;

  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-card: 0 4px 16px rgba(0,0,0,0.06);
}

[data-theme="dark"] {
  /* DARK THEME (True Charcoal Zinc) */
  --bg-page: #121316;
  --bg-surface: #191a20;
  --bg-surface-hover: #22232c;
  --bg-surface-active: #2b2d38;
  --border-subtle: #272935;
  --border-strong: #383a4c;

  --text-primary: #f4f5f8;
  --text-secondary: #9da2b2;
  --text-muted: #676c7d;

  --accent: #38bdf8;
  --accent-soft: #0369a133;

  --ok-text: #34d399; --ok-bg: #064e3b33; --ok-border: #065f46;
  --bad-text: #f87171; --bad-bg: #450a0a33; --bad-border: #7f1d1d;
  --warn-text: #fbbf24; --warn-bg: #451a0333; --warn-border: #78350f;
  --info-text: #38bdf8; --info-bg: #0369a126; --info-border: #075985;
  --purple-text: #c084fc; --purple-bg: #581c8733; --purple-border: #6b21a8;

  --cefr-a: #34d399; --cefr-a-bg: #064e3b33;
  --cefr-b: #38bdf8; --cefr-b-bg: #0369a133;
  --cefr-c: #c084fc; --cefr-c-bg: #581c8733;

  --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);
  --shadow-card: 0 4px 20px rgba(0,0,0,0.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background-color: var(--bg-page);
  color: var(--text-primary);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  line-height: 1.6;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

.en { direction: ltr; unicode-bidi: isolate; font-family: var(--font-sans); }
.mono { font-family: var(--font-mono); }

.app-shell {
  max-width: 1680px;
  width: 100%;
  margin: 0 auto;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg-surface);
  border-left: 1px solid var(--border-subtle);
  border-right: 1px solid var(--border-subtle);
  box-shadow: 0 0 50px rgba(0,0,0,0.3);
  overflow: hidden;
}

/* TOP APP BAR */
.top-header {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  padding: 12px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  gap: 16px;
}
.brand-zone {
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand-title {
  font-size: 17px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 8px;
}
.badge-version {
  font-size: 11px;
  font-weight: 700;
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 1px 7px;
  border-radius: 5px;
}
.kpi-strip {
  display: flex;
  gap: 8px;
  align-items: center;
}
.kpi-pill {
  font-size: 12px;
  padding: 2px 9px;
  border-radius: 6px;
  background: var(--bg-page);
  border: 1px solid var(--border-subtle);
  font-weight: 700;
}
.kpi-pill.ok { color: var(--ok-text); border-color: var(--ok-border); background: var(--ok-bg); }
.kpi-pill.bad { color: var(--bad-text); border-color: var(--bad-border); background: var(--bad-bg); }

.controls-zone {
  display: flex;
  align-items: center;
  gap: 14px;
}
.hotkey-tag {
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
}
.kbd-btn {
  background: var(--bg-page);
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 11px;
  font-family: var(--font-sans);
}
.theme-btn {
  background: var(--bg-page);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  padding: 6px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-sans);
  transition: all 0.15s;
}
.theme-btn:hover {
  background: var(--bg-surface-active);
  border-color: var(--border-strong);
}

/* FILTER TOOLBAR (Clean human typography, no terminal font) */
.filter-bar {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  padding: 10px 24px;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  flex-shrink: 0;
}
.search-input {
  background: var(--bg-page);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
  width: 230px;
  outline: none;
  font-family: var(--font-sans);
  transition: border-color 0.15s;
}
.search-input:focus { border-color: var(--accent); }

.filter-group { display: flex; gap: 4px; }
.pill-btn {
  background: var(--bg-page);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 12px;
  font-family: var(--font-sans);
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.pill-count {
  font-size: 11px;
  opacity: 0.75;
  font-weight: 600;
}
.pill-btn.active {
  background: var(--text-primary);
  color: var(--bg-surface);
  border-color: var(--text-primary);
}
.pill-btn.active .pill-count {
  opacity: 1;
}

.select-box {
  background: var(--bg-page);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 12.5px;
  outline: none;
  font-family: var(--font-sans);
  font-weight: 600;
  cursor: pointer;
}

/* SPLIT WORKSPACE */
.split-workspace {
  display: grid;
  grid-template-columns: 320px 1fr;
  flex: 1;
  overflow: hidden;
}

/* SIDEBAR LIST */
.sidebar {
  background: var(--bg-surface);
  border-left: 1px solid var(--border-subtle);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.card-nav-tile {
  padding: 12px 18px;
  border-bottom: 1px solid var(--border-subtle);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background 0.12s;
}
.card-nav-tile:hover { background: var(--bg-surface-hover); }
.card-nav-tile.selected {
  background: var(--bg-surface-active);
  border-right: 3px solid var(--accent);
}
.tile-info { display: flex; flex-direction: column; gap: 2px; }
.tile-word { font-weight: 700; font-size: 14.5px; display: flex; align-items: baseline; gap: 6px; }
.tile-sub { font-size: 11px; color: var(--text-muted); font-family: var(--font-sans); }
.tile-badges { display: flex; gap: 5px; align-items: center; }

.cefr-pill {
  font-size: 11px;
  font-weight: 800;
  padding: 1px 7px;
  border-radius: 4px;
}
.cefr-A1, .cefr-A2 { background: var(--cefr-a-bg); color: var(--cefr-a); }
.cefr-B1, .cefr-B2 { background: var(--cefr-b-bg); color: var(--cefr-b); }
.cefr-C1, .cefr-C2 { background: var(--cefr-c-bg); color: var(--cefr-c); }

.verdict-pill {
  font-size: 10.5px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 4px;
}
.verdict-pill.ok { background: var(--ok-bg); color: var(--ok-text); border: 1px solid var(--ok-border); }
.verdict-pill.bad { background: var(--bad-bg); color: var(--bad-text); border: 1px solid var(--bad-border); }

/* DETAIL PANE */
.detail-pane {
  background: var(--bg-page);
  overflow-y: auto;
  padding: 24px 32px 60px;
}
.detail-container {
  max-width: 640px;
  margin: 0 auto;
}
/* R1: narrow learner cards — centered column, taller not wider */
.learner-card-bot, .learner-card-lexico, .learner-card-editorial {
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
  width: 100%;
}
/* R3: faint topic/CEFR tags in hero — present but not loud */
.hero-box .chip-tag, .hero-box .cefr-pill { opacity: 0.6; font-weight: 600; }
/* R5: synonym=green / antonym=red text (no emoji) */
.syn-text { color: var(--ok-text); font-weight: 700; }
.ant-text { color: var(--bad-text); font-weight: 700; }

/* HERO BOX (Strictly LTR IPA Alignment) */
.hero-box {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 18px 24px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow-sm);
  flex-wrap: wrap;
  gap: 12px;
}
.hero-main {
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex-wrap: wrap;
}
.hero-title {
  font-size: 26px;
  font-weight: 800;
  direction: ltr;
  text-align: left;
}
.hero-ipa {
  direction: ltr;
  text-align: left;
  unicode-bidi: isolate;
  font-family: var(--font-sans);
  font-size: 16px;
  color: var(--text-muted);
}
.hero-sense-tag {
  font-size: 11px;
  background: var(--bg-page);
  padding: 2px 7px;
  border-radius: 4px;
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
  direction: ltr;
}

.chip-tag {
  font-size: 12px;
  background: var(--bg-page);
  border: 1px solid var(--border-subtle);
  padding: 2px 9px;
  border-radius: 6px;
  color: var(--text-secondary);
  font-weight: 600;
}

/* TAB SWITCHER */
.view-tabs-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}
.tabs-left { display: flex; gap: 8px; }
.style-switch-group {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-surface);
  padding: 3px 8px;
  border-radius: 8px;
  border: 1px solid var(--border-subtle);
}
.style-switch-label {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-muted);
}
.style-btn {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 5px;
  cursor: pointer;
  transition: all 0.15s;
}
.style-btn.active {
  background: var(--accent-soft);
  color: var(--accent);
}

.vtab-btn {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 700;
  padding: 8px 18px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s;
}
.vtab-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  box-shadow: var(--shadow-sm);
}

/* =========================================================
   STYLE 1: AUTHENTIC BOT REPLICA (Exact User Spec)
   ========================================================= */
.learner-card-bot {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 28px 32px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: 20px;
  line-height: 1.85;
}

.bot-header {
  border-bottom: 1px solid var(--border-subtle);
  padding-bottom: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.bot-word {
  font-size: 26px;
  font-weight: 800;
  color: var(--text-primary);
  direction: ltr;
  text-align: center;
}
.bot-ipa {
  direction: ltr;
  text-align: center;
  unicode-bidi: isolate;
  font-size: 15px;
  color: var(--text-muted);
}

.bot-def-block {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.bot-en-def {
  font-size: 14px;
  color: var(--text-secondary);
  direction: ltr;
  text-align: center;
  unicode-bidi: isolate;
  margin-bottom: 4px;
}
.bot-fa-meaning {
  font-size: 19px;
  font-weight: 800;
  color: var(--accent);
  display: flex;
  align-items: baseline;
  justify-content: center;
  text-align: center;
  gap: 8px;
}
.bot-fa-meaning .glyph { color: var(--accent); font-size: 16px; }
.bot-fa-explanation {
  font-size: 14.5px;
  color: var(--text-secondary);
  padding-right: 0;
  text-align: center;
}

.bot-syn-ant {
  background: var(--bg-page);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 12px 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 14px;
  text-align: center;
}
.bot-syn-line, .bot-ant-line {
  display: flex;
  align-items: baseline;
  justify-content: center;
  text-align: center;
  gap: 8px;
  flex-wrap: wrap;
}

.bot-examples {
  display: flex;
  flex-direction: column;
  gap: 12px;
  text-align: center;
}
.bot-ex-heading {
  font-size: 14.5px;
  font-weight: 800;
  color: var(--text-primary);
  text-align: center;
}
.bot-ex-card {
  background: var(--bg-page);
  border: 1px solid var(--border-subtle);
  padding: 10px 16px;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 4px;
}
.bot-ex-en {
  direction: ltr;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 8px;
}
.bot-ex-en .bullet { color: var(--accent); font-size: 11px; }
.bot-ex-fa {
  font-size: 13.5px;
  color: var(--text-secondary);
  padding-right: 0;
  text-align: center;
}

.bot-grammar {
  background: var(--warn-bg);
  border: 1px solid var(--warn-border);
  border-radius: 8px;
  padding: 14px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 4px;
  font-size: 14px;
}
.bot-grammar-heading {
  font-weight: 800;
  color: var(--warn-text);
}
.bot-grammar-body {
  color: var(--text-primary);
}

/* =========================================================
   STYLE 2: MODERN LEXICO (Structured Card UI)
   ========================================================= */
.learner-card-lexico {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 28px 32px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.lex-top {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  border-bottom: 1px solid var(--border-subtle);
  padding-bottom: 16px;
  gap: 8px;
}
.lex-word-group {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 14px;
  direction: ltr;
}
.lex-word { font-size: 28px; font-weight: 800; }
.lex-ipa { font-size: 16px; color: var(--text-muted); }
.lex-meaning-card {
  background: var(--bg-page);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 6px;
}
.lex-fa-lead { font-size: 20px; font-weight: 800; color: var(--accent); text-align: center; }
.lex-fa-desc { font-size: 14.5px; color: var(--text-secondary); text-align: center; }
.lex-en-def {
  font-size: 13.5px;
  color: var(--text-muted);
  direction: ltr;
  text-align: center;
  border-top: 1px dashed var(--border-subtle);
  padding-top: 6px;
  margin-top: 4px;
}
.lex-chips-wrap {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}
.lex-chip-item {
  background: var(--bg-page);
  border: 1px solid var(--border-subtle);
  padding: 4px 12px;
  border-radius: 6px;
  font-size: 13px;
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
}

/* =========================================================
   STYLE 3: EDITORIAL MINIMAL (Print Dictionary Feel)
   ========================================================= */
.learner-card-editorial {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 32px 36px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: 16px;
  font-size: 15px;
}
.ed-head {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 4px;
  direction: ltr;
  border-bottom: 2px solid var(--text-primary);
  padding-bottom: 8px;
}
.ed-word { font-size: 30px; font-weight: 900; letter-spacing: -0.5px; text-align: center; }
.ed-ipa { font-size: 17px; color: var(--text-muted); text-align: center; }
.ed-def-line {
  direction: ltr;
  text-align: center;
  font-size: 14.5px;
  color: var(--text-secondary);
  font-style: normal;
}
.ed-fa-line {
  font-size: 18px;
  font-weight: 800;
  color: var(--text-primary);
  text-align: center;
}
.ed-ex-block {
  border-right: none;
  border-top: 2px solid var(--border-strong);
  padding-right: 0;
  padding-top: 10px;
  margin: 6px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 8px;
}
.ed-ex-en { font-weight: 600; direction: ltr; text-align: center; font-size: 14px; }
.ed-ex-fa { color: var(--text-secondary); font-size: 13.5px; text-align: center; }

/* =========================================================
   AUDIT & PIPELINE SECTION
   ========================================================= */
.audit-panel {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.pipeline-box {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 20px 24px;
  box-shadow: var(--shadow-sm);
}
.pipeline-box h4 {
  font-size: 14px;
  font-weight: 800;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.pipeline-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}
.pipe-card {
  background: var(--bg-page);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;

  margin-top: 4px;
}
.gate-chip {

  font-weight: 700;
  padding: 1px 6px;

}
.gate-chip.pass { background: var(--ok-bg); color: var(--ok-text); border: 1px solid var(--ok-border); }
.gate-chip.fail { background: var(--bad-bg); color: var(--bad-text); border: 1px solid var(--bad-border); }

.diff-box {

  border-radius: 12px;
  padding: 20px 24px;

}
.diff-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-top: 12px;
}
.diff-table th, .diff-table td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border-subtle);
  text-align: right;
  vertical-align: top;
}
.diff-table th {
  background: var(--bg-page);
  font-weight: 700;
  color: var(--text-muted);
}
.diff-table tr:hover td {
  background: var(--bg-surface-hover);
}

.op-pill {

  font-weight: 700;

  border-radius: 5px;

.op-kept {

  border: 1px solid var(--ok-border);
}

  border: 1px solid var(--info-border);
}
.op-improved {
  background: var(--warn-bg);
  color: var(--warn-text);
  border: 1px solid var(--warn-border);
}
.op-released {
  background: var(--purple-bg);
  color: var(--purple-text);
  border: 1px solid var(--purple-border);
}
.op-aborted {
  background: var(--bad-bg);
  color: var(--bad-text);
  border: 1px solid var(--bad-border);
}
.op-none {
  background: var(--bg-page);
  color: var(--text-muted);
  border: 1px solid var(--border-subtle);
}

/* ERROR NOTICE CARD */
.error-fallback-card {
  background: var(--bad-bg);

  text-align: center;

  flex-direction: column;

}
.error-fallback-reason {

  margin-top: 6px;
}

  filterState.topic = topic;

  filteredCards = CARDS.filter(c => {
    if (q && !c.word.toLowerCase().includes(q) && !(c.sense_id || "").toLowerCase().includes(q) && !(c.fa_meaning || "").includes(q) && !(c.error_msg || "").toLowerCase().includes(q)) {
      return false;
    }
    if (filterState.status === "OK" && !c.status_ok) return false;
    if (filterState.status === "BAD" && c.status_ok) return false;
    if (filterState.kind !== "ALL" && c.kind !== filterState.kind) return false;
    if (filterState.cefr !== "ALL" && c.cefr !== filterState.cefr) return false;
    if (topic !== "ALL" && c.topic !== topic) return false;
    return true;
  });

  if (selectedIndex >= filteredCards.length) selectedIndex = 0;
  renderSidebar();
  renderWorkspace();
}

function renderSidebar() {
  const sidebar = document.getElementById("sidebarList");
  sidebar.innerHTML = "";
  filteredCards.forEach((c, idx) => {
    const el = document.createElement("div");
    el.className = `card-nav-tile ${idx === selectedIndex ? "selected" : ""}`;
    el.id = `card-nav-${idx}`;
    el.onclick = () => selectCard(idx);
    el.innerHTML = `
      <div class="tile-info">
        <span class="tile-word">
          ${c.word}
          <span style="font-size:11px; color:var(--text-muted); font-weight:normal;">(${c.kind})</span>
        </span>
        <span class="tile-sub en">${c.sense_id || "—"}</span>
      </div>
      <div class="tile-badges">
        <span class="cefr-pill cefr-${c.cefr}">${c.cefr}</span>
        <span class="verdict-pill ${c.status_ok ? "ok" : "bad"}">${c.status_ok ? "تأیید" : "خطا"}</span>
      </div>
    `;
    sidebar.appendChild(el);
  });
}

function selectCard(idx) {
  if (idx < 0 || idx >= filteredCards.length) return;
  selectedIndex = idx;
  document.querySelectorAll(".card-nav-tile").forEach((el, i) => {
    el.classList.toggle("selected", i === idx);
  });
  const activeTile = document.getElementById(`card-nav-${idx}`);
  if (activeTile) activeTile.scrollIntoView({ block: "nearest" });

  document.getElementById("detailPane").scrollTop = 0;
  renderWorkspace();
}

function setActiveTab(tab) {
  activeTab = tab;
  renderWorkspace();
}

function getOpClass(opText) {
  if (!opText) return "op-none";
  if (opText.includes("نگه‌داشت") || opText.includes("kept") || opText.includes("keep") || opText.includes("dataset")) return "op-kept";
  if (opText.includes("پرشده") || opText.includes("model") || opText.includes("filled")) return "op-filled";
  if (opText.includes("بازبینی") || opText.includes("improved") || opText.includes("review")) return "op-improved";
  if (opText.includes("آزادشده")) return "op-released";
  if (opText.includes("لغوشده") || opText.includes("aborted") || opText.includes("خطا") || opText.includes("error") || opText.includes("rejected")) return "op-aborted";
  return "op-none";
}

function renderWorkspace() {
  const c = filteredCards[selectedIndex];
  const container = document.getElementById("detailContainer");
  if (!c) {
    container.innerHTML = `<div style="text-align:center; padding:100px; color:var(--text-muted);">موردی مطابق با فیلترها یافت نشد.</div>`;
    return;
  }

  // Hero Bar with STRICT LTR IPA
  const heroHtml = `
    <div class="hero-box">
      <div class="hero-main">
        <div class="hero-title">${c.word}</div>
        ${c.ipa ? `<div class="hero-ipa">${c.ipa}</div>` : ""}
        <div class="hero-sense-tag">${c.sense_id || "—"}</div>
      </div>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <span class="cefr-pill cefr-${c.cefr}" style="font-size:11.5px; padding:3px 8px;">${c.cefr}</span>
        <span class="chip-tag">${c.kind}</span>
        <span class="chip-tag">${c.topic}</span>
        <span class="chip-tag mono" style="font-size:11px;">${c.model}</span>
        <span class="verdict-pill ${c.status_ok ? "ok" : "bad"}" style="font-size:11.5px; padding:3px 8px;">
          ${c.status_ok ? "✓ تأیید شد" : "✕ خطا"}
        </span>
      </div>
    </div>
  `;

  // Tab Switcher with 3 Presentation Styles switcher for Learner View
  const tabsHtml = `
    <div class="view-tabs-bar">
      <div class="tabs-left">
        <button class="vtab-btn ${activeTab === 'learner' ? 'active' : ''}" onclick="setActiveTab('learner')">
          <span>👁️</span> نمای زبان‌آموز (Learner Card)
        </button>
        <button class="vtab-btn ${activeTab === 'audit' ? 'active' : ''}" onclick="setActiveTab('audit')">
          <span>⚙️</span> خط لوله و ممیزی (Pipeline & Diff)
        </button>
      </div>

      ${activeTab === 'learner' && (c.status_ok || c.fa_meaning) ? `
      <div class="style-switch-group">
        <span class="style-switch-label">سبک کارت:</span>
        <button class="style-btn ${learnerStyle === 'bot' ? 'active' : ''}" onclick="setLearnerStyle('bot')">هم‌زبون (Bot)</button>
        <button class="style-btn ${learnerStyle === 'lexico' ? 'active' : ''}" onclick="setLearnerStyle('lexico')">ساختاریافته (Lexico)</button>
        <button class="style-btn ${learnerStyle === 'editorial' ? 'active' : ''}" onclick="setLearnerStyle('editorial')">مینیمال (Editorial)</button>
      </div>` : ''}
    </div>
  `;

  let bodyHtml = "";

  if (activeTab === "learner") {
    if (!c.status_ok && !c.fa_meaning) {
      bodyHtml = `
        <div class="error-fallback-card">
          <div class="error-fallback-title">این کارت به دلیل خطا تأیید نشده است</div>
          <div class="error-fallback-reason">دلیل رد شدن: ${c.error_msg}</div>
          <p style="font-size:13.5px; color:var(--text-secondary); max-width:500px;">
            خروجی نهایی زبان‌آموز برای این کارت به دلیل عدم عبور از گیت‌های کیفی مسدود شده است.
          </p>
          <button class="error-jump-btn" onclick="setActiveTab('audit')">
            مشاهده گزارش دیف و گیت‌های خط لوله ➔
          </button>
        </div>
      `;
    } else {
      const synStr = (c.synonyms && c.synonyms.length > 0) ? c.synonyms.join("، ") : "—";
      const antStr = (c.antonyms && c.antonyms.length > 0) ? c.antonyms.join("، ") : "—";

      if (learnerStyle === "bot") {
        // PROTOTYPE A: TELEGRAM BOT REPLICA (Exact User Spec)
        let exsHtml = "";
        if (c.examples && c.examples.length > 0) {
          exsHtml = c.examples.map((ex, i) => `
            <div class="bot-ex-card">
              <div class="bot-ex-en">
                <span class="bullet">✦</span>
                <span>${ex}</span>
              </div>
              <div class="bot-ex-fa">${c.example_translations[i] || ""}</div>
            </div>
          `).join("");
        } else {
          exsHtml = `<div style="color:var(--text-muted); font-size:13px; font-style:italic;">— (بدون مثال)</div>`;
        }

        bodyHtml = `
          <article class="learner-card-bot">
            <div class="bot-header">
              <div class="bot-word">${c.word}</div>
              ${c.ipa ? `<div class="bot-ipa">${c.ipa}</div>` : ""}
            </div>

            <!-- CORRECT SPEC: def, then ✤ persian def, then explanation -->
            <div class="bot-def-block">
              ${c.en_def ? `<div class="bot-en-def">${c.en_def}</div>` : ""}
              <div class="bot-fa-meaning">
                <span class="glyph">✤</span>
                <span>${c.fa_meaning || "—"}</span>
              </div>
              ${c.fa_explanation ? `<div class="bot-fa-explanation">${c.fa_explanation}</div>` : ""}
            </div>

            <div class="bot-syn-ant">
              <div class="bot-syn-line">
                <span class="en syn-text">${synStr}</span>
              </div>
              <div class="bot-ant-line">
                <span class="en ant-text">${antStr}</span>
              </div>
            </div>

            <div class="bot-examples">
              <div class="bot-ex-heading">📝 مثال‌ها + ترجمه:</div>
              ${exsHtml}
            </div>

            ${c.grammar_tip ? `
            <div class="bot-grammar">
              <div class="bot-grammar-heading">✍️ نکته‌ی گرامری:</div>
              <div class="bot-grammar-body">${c.grammar_tip}</div>
            </div>` : ""}
          </article>
        `;
      } else if (learnerStyle === "lexico") {
        // PROTOTYPE B: STRUCTURED LEXICO CARD
        let exsHtml = (c.examples || []).map((ex, i) => `
          <div style="background:var(--bg-page); border:1px solid var(--border-subtle); padding:10px 14px; border-radius:8px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:3px;">
            <div style="direction:ltr; text-align:center; font-weight:700; font-size:14px;">${ex}</div>
            <div style="color:var(--text-secondary); font-size:13.5px; text-align:center;">${c.example_translations[i] || ""}</div>
          </div>
        `).join("");

        bodyHtml = `
          <article class="learner-card-lexico">
            <div class="lex-top">
              <div class="lex-word-group">
                <span class="lex-word">${c.word}</span>
                ${c.ipa ? `<span class="lex-ipa">${c.ipa}</span>` : ""}
              </div>
              <span class="cefr-pill cefr-${c.cefr}" style="font-size:12px; padding:3px 9px;">${c.cefr}</span>
            </div>

            <div class="lex-meaning-card">
              <div class="lex-fa-lead">${c.fa_meaning || "—"}</div>
              <div class="lex-fa-desc">${c.fa_explanation || ""}</div>
              ${c.en_def ? `<div class="lex-en-def">${c.en_def}</div>` : ""}
            </div>

            <div class="lex-chips-wrap">
              <div class="lex-chip-item"><strong class="en syn-text">${synStr}</strong></div>
              <div class="lex-chip-item"><strong class="en ant-text">${antStr}</strong></div>
            </div>

            <div style="display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px;">
              <div style="font-size:14px; font-weight:800;">مثال‌ها و ترجمه:</div>
              ${exsHtml || '<div style="color:var(--text-muted); font-size:13px;">بدون مثال</div>'}
            </div>

            ${c.grammar_tip ? `
            <div style="background:var(--warn-bg); border:1px solid var(--warn-border); border-radius:8px; padding:12px 16px; font-size:13.5px; text-align:center;">
              <strong style="color:var(--warn-text);">نکته گرامری:</strong> ${c.grammar_tip}
            </div>` : ""}
          </article>
        `;
      } else {
        // PROTOTYPE C: EDITORIAL COMPACT
        let exsHtml = (c.examples || []).map((ex, i) => `
          <div class="ed-ex-block">
            <div class="ed-ex-en">${ex}</div>
            <div class="ed-ex-fa">${c.example_translations[i] || ""}</div>
          </div>
        `).join("");

        bodyHtml = `
          <article class="learner-card-editorial">
            <div class="ed-head">
              <span class="ed-word">${c.word}</span>
              ${c.ipa ? `<span class="ed-ipa">${c.ipa}</span>` : ""}
            </div>

            ${c.en_def ? `<div class="ed-def-line">${c.en_def}</div>` : ""}
            <div class="ed-fa-line">✤ ${c.fa_meaning || "—"}</div>
            ${c.fa_explanation ? `<div style="color:var(--text-secondary); text-align:center;">${c.fa_explanation}</div>` : ""}

            <div style="font-size:13.5px; margin:4px 0; text-align:center;">
              <strong class="en syn-text">${synStr}</strong>
              <span style="margin:0 12px; color:var(--border-strong)">|</span>
              <strong class="en ant-text">${antStr}</strong>
            </div>

            <div style="text-align:center;">
              <div style="font-weight:800; font-size:14px; margin-bottom:6px;">مثال‌ها:</div>
              ${exsHtml || '<div style="color:var(--text-muted); font-size:13px;">بدون مثال</div>'}
            </div>

            ${c.grammar_tip ? `
            <div style="font-size:13.5px; border-top:1px dashed var(--border-subtle); padding-top:10px; color:var(--text-secondary); text-align:center;">
              <strong style="color:var(--text-primary);">نکته گرامری:</strong> ${c.grammar_tip}
            </div>` : ""}
          </article>
        `;
      }
    }
  } else {
    // Pipeline & Diff View
    const gatesChips = (c.gates || []).map(g => `
      <span class="gate-chip ${g.pass ? 'pass' : 'fail'}">${g.name}: ${g.status}</span>
    `).join("");

    const diffRows = (c.diff_rows || []).map(d => `
      <tr>
        <td style="font-weight:700; width:130px;">${d.label}</td>
        <td style="color:var(--text-muted); font-size:12.5px; width:30%;">${d.pre || "—"}</td>
        <td style="width:140px;"><span class="op-pill ${getOpClass(d.op)}">${d.op}</span></td>
        <td style="font-size:13px; font-weight:500;">${d.fin || "—"}</td>
      </tr>
    `).join("");

    bodyHtml = `
      <div class="audit-panel">
        <div class="pipeline-box">
          <h4><span>⚡</span> مراحل خط لوله و گیت‌های کنترل کیفیت</h4>
          <div class="pipeline-grid">
            <div class="pipe-card">
              <span class="pipe-card-title">۱. ورودی پیش‌کارت</span>
              <div class="en" style="font-weight:700;">${c.sense_id || "—"}</div>
              <div style="font-size:11.5px; color:var(--text-secondary);">${c.anchor_def || ""}</div>
            </div>

            <div class="pipe-card">
              <span class="pipe-card-title">۲. فراخوانی مدل</span>
              <div class="en" style="font-weight:700; color:var(--accent);">${c.model}</div>
              <div style="font-size:11px; color:var(--text-muted);">تکمیل فیلدهای شکاف و داوری</div>
            </div>

            <div class="pipe-card">
              <span class="pipe-card-title">۳. گیت‌های ممیزی</span>
              <div class="pipe-gates-wrap">
                ${gatesChips || '<span style="color:var(--text-muted); font-size:11px;">بدون گیت</span>'}
              </div>
            </div>

            <div class="pipe-card" style="border-color:${c.status_ok ? 'var(--ok-border)' : 'var(--bad-border)'}; background:${c.status_ok ? 'var(--ok-bg)' : 'var(--bad-bg)'};">
              <span class="pipe-card-title" style="color:${c.status_ok ? 'var(--ok-text)' : 'var(--bad-text)'};">۴. نتیجه نهایی</span>
              <div style="font-weight:800; color:${c.status_ok ? 'var(--ok-text)' : 'var(--bad-text)'};">
                ${c.status_ok ? "تأیید شد (OK)" : "رد شد (Error)"}
              </div>
              <div style="font-size:11px; color:${c.status_ok ? 'var(--ok-text)' : 'var(--bad-text)'};" class="en">
                ${c.status_ok ? "قبول تمام آزمون‌ها" : c.error_msg}
              </div>
            </div>
          </div>
        </div>

        <div class="diff-box">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h4 style="font-size:14px; font-weight:800;"><span>📊</span> جدول تغییرات پیش‌کارت و مدل (Diff)</h4>
            <span style="font-size:11px; color:var(--text-muted);">${c.diff_rows.length} فیلد مقایسه شد</span>
          </div>
          <table class="diff-table">
            <thead>
              <tr>
                <th>میدان</th>
                <th>ورودی پیش‌کارت</th>
                <th>عملیات</th>
                <th>خروجی نهایی</th>
              </tr>
            </thead>
            <tbody>
              ${diffRows || '<tr><td colspan="4" style="text-align:center;">بدون جدول تغییرات</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  container.innerHTML = heroHtml + tabsHtml + bodyHtml;
}

function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "dark";
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  document.getElementById("themeIcon").textContent = next === "dark" ? "🌙" : "☀️";
}

function initStatsAndTopics() {
  let okCount = 0, badCount = 0;
  let wordCount = 0, phraseCount = 0;
  const topics = {};
  const cefrCounts = { "A1": 0, "A2": 0, "B1": 0, "B2": 0, "C1": 0, "C2": 0 };

  CARDS.forEach(c => {
    if (c.status_ok) okCount++; else badCount++;
    if (c.kind === "واژه") wordCount++; else phraseCount++;
    if (cefrCounts[c.cefr] !== undefined) cefrCounts[c.cefr]++;
    if (c.topic) topics[c.topic] = (topics[c.topic] || 0) + 1;
  });

  document.getElementById("c-stat-all").textContent = `(${CARDS.length})`;
  document.getElementById("c-stat-ok").textContent = `(${okCount})`;
  document.getElementById("c-stat-bad").textContent = `(${badCount})`;
  document.getElementById("c-kind-word").textContent = `(${wordCount})`;
  document.getElementById("c-kind-phrase").textContent = `(${phraseCount})`;

  for (const [lvl, count] of Object.entries(cefrCounts)) {
    const el = document.getElementById(`c-cefr-${lvl}`);
    if (el) el.textContent = `(${count})`;
  }

  document.getElementById("kpiTotal").textContent = `${CARDS.length} کارت`;
  document.getElementById("kpiOk").textContent = `${okCount} تأیید شد`;
  document.getElementById("kpiBad").textContent = `${badCount} خطا`;

  const topicSel = document.getElementById("topicFilter");
  topicSel.innerHTML = `<option value="ALL">همه موضوعات (${Object.keys(topics).length})</option>`;
  Object.keys(topics).sort().forEach(t => {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = `${t} (${topics[t]})`;
    topicSel.appendChild(opt);
  });
}

window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if (e.key === "ArrowDown" || e.key === "j" || e.key === "J") {
    e.preventDefault();
    if (selectedIndex < filteredCards.length - 1) selectCard(selectedIndex + 1);
  } else if (e.key === "ArrowUp" || e.key === "k" || e.key === "K") {
    e.preventDefault();
    if (selectedIndex > 0) selectCard(selectedIndex - 1);
  } else if (e.key === "/") {
    e.preventDefault();
    document.getElementById("searchInput").focus();
  }
});

initStatsAndTopics();
applyFilters();
</script>
</body>
</html>
