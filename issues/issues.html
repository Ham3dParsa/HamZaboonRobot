<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بررسی کد ربات هم‌زبان — نقاط بهبود</title>
    <!-- Font Awesome (for icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Google Font: Vazirmatn (Persian) -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ---------- Reset & Base ---------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: linear-gradient(180deg, #e9eef7 0%, #f7fafc 100%);
            color: #10243f;
            padding: 2rem 1rem;
            min-height: 100vh;
            direction: rtl;
        }

        .container {
            max-width: 1320px;
            margin: 0 auto;
            width: 100%;
        }

        /* ---------- Header ---------- */
        .header {
            background: linear-gradient(145deg, #1a425e, #2f6d8a);
            color: #f8fbff;
            border-radius: 28px;
            padding: 2rem 2.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 18px 48px rgba(15, 43, 75, 0.22);
            position: relative;
            overflow: hidden;
        }
        .header::after {
            content: '';
            position: absolute;
            top: -45%;
            left: -28%;
            width: 320px;
            height: 320px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            pointer-events: none;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            position: relative;
            z-index: 1;
        }
        .header h1 i {
            color: #f4d35e;
            font-size: 1.8rem;
        }
        .header p {
            margin-top: 0.6rem;
            font-size: 1rem;
            opacity: 0.95;
            font-weight: 400;
            position: relative;
            z-index: 1;
            max-width: 85%;
            color: #e6eef7;
        }
        .header .stats {
            display: flex;
            gap: 1.6rem;
            margin-top: 1.2rem;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }
        .header .stats span {
            background: rgba(255, 255, 255, 0.14);
            padding: 0.35rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header .stats span i {
            font-size: 0.9rem;
        }
        .stats .badge-high {
            color: #f8c6c3;
        }
        .stats .badge-medium {
            color: #ffe49f;
        }
        .stats .badge-low {
            color: #a7f3d0;
        }

        /* ---------- Controls ---------- */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
            margin-bottom: 1rem;
            background: #ffffff;
            padding: 1rem 1.35rem;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(15, 43, 75, 0.08);
        }
        .controls .filter-group {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        .controls .filter-group button {
            background: transparent;
            border: none;
            padding: 0.45rem 1rem;
            border-radius: 40px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: #475569;
            border: 1.5px solid transparent;
        }
        .controls .filter-group button:hover {
            background: #f3f7fb;
            color: #10243f;
        }
        .controls .filter-group button.active {
            background: #1f4f70;
            color: #fff;
            border-color: #1f4f70;
        }
        .controls .filter-group button.active-high {
            background: #b91c1c;
            border-color: #b91c1c;
            color: #fff;
        }
        .controls .filter-group button.active-medium {
            background: #b45309;
            border-color: #b45309;
            color: #fff;
        }
        .controls .filter-group button.active-low {
            background: #047857;
            border-color: #047857;
            color: #fff;
        }

        .controls .search-box {
            margin-right: auto;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 0.35rem;
            min-width: min(360px, 100%);
            flex: 1 1 360px;
            background: #f3f7fb;
            border-radius: 20px;
            padding: 0.45rem 0.6rem 0.45rem 0.7rem;
            border: 1.5px solid transparent;
            transition: border 0.2s, background 0.2s;
        }
        .controls .search-box:focus-within {
            border-color: #1f4f70;
            background: #ffffff;
        }
        .controls .search-box .search-input-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .controls .search-box i {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .controls .search-box input {
            border: none;
            background: transparent;
            padding: 0.5rem 0.6rem;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
            color: #10243f;
        }
        .controls .search-box input::placeholder {
            color: #94a3b8;
            font-weight: 300;
        }
        .controls .search-box .clear-search {
            border: none;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            padding: 0.3rem 0.5rem;
            border-radius: 999px;
        }
        .controls .search-box .clear-search:hover {
            color: #dc2626;
            background: rgba(220, 38, 38, 0.08);
        }
        .controls .search-box .search-hint {
            font-size: 0.75rem;
            color: #64748b;
            padding: 0 0.2rem 0.2rem 0.2rem;
        }

        .controls .control-pill {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            background: #f3f7fb;
            border-radius: 40px;
            padding: 0.28rem 0.75rem;
            border: 1.5px solid transparent;
            min-height: 42px;
        }
        .controls .control-pill:focus-within {
            border-color: #1f4f70;
            background: #ffffff;
        }
        .controls .control-pill i {
            color: #94a3b8;
            font-size: 0.92rem;
        }
        .controls .control-pill select,
        .controls .control-pill input {
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.92rem;
            outline: none;
            color: #10243f;
            min-width: 120px;
        }
        .controls .control-pill input {
            width: 130px;
        }
        .controls .control-pill button {
            border: none;
            background: #1f4f70;
            color: #fff;
            cursor: pointer;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
        }
        .controls .control-pill button:hover {
            background: #184862;
        }
        .controls .results-summary {
            font-size: 0.9rem;
            color: #475569;
            font-weight: 600;
            padding: 0 0.2rem;
        }

        .controls .reset-btn,
        .controls .btn-add {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 0.95rem;
            cursor: pointer;
            padding: 0.45rem 0.9rem;
            border-radius: 40px;
            transition: all 0.2s;
        }
        .controls .btn-add {
            background: #1f4f70;
            color: #fff;
            border: 1.5px solid transparent;
            box-shadow: 0 12px 24px rgba(31, 79, 112, 0.16);
        }
        .controls .reset-btn:hover {
            background: #f1f5f9;
            color: #ef4444;
        }
        .controls .btn-add:hover {
            background: #184862;
        }

        .form-panel {
            display: none;
            background: #ffffff;
            border: 1px solid rgba(15, 43, 75, 0.08);
            border-radius: 24px;
            padding: 1.4rem 1.5rem;
            box-shadow: 0 18px 40px rgba(15, 43, 75, 0.08);
            margin-bottom: 1.5rem;
        }
        .form-panel.open {
            display: block;
        }
        .form-panel h2 {
            margin-bottom: 1rem;
            font-size: 1.05rem;
            color: #10243f;
        }
        .form-panel .field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: start;
        }
        .form-panel .field-grid.full {
            grid-template-columns: 1fr;
        }
        .form-panel label {
            display: block;
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 0.35rem;
        }
        .form-panel input,
        .form-panel select,
        .form-panel textarea {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            background: #f8fafc;
            color: #10243f;
            font-family: inherit;
            font-size: 0.92rem;
            padding: 0.9rem 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-panel input:focus,
        .form-panel select:focus,
        .form-panel textarea:focus {
            border-color: #1f4f70;
            box-shadow: 0 0 0 4px rgba(31, 79, 112, 0.1);
            background: #ffffff;
        }
        .form-panel textarea {
            resize: vertical;
            min-height: 120px;
        }
        .form-panel .form-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: flex-start;
            align-items: center;
            margin-top: 0.25rem;
        }
        .form-panel .form-actions button {
            border: none;
            border-radius: 999px;
            padding: 0.75rem 1.3rem;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .form-panel .form-actions .btn-save {
            background: #1f4f70;
            color: #fff;
            box-shadow: 0 12px 24px rgba(31, 79, 112, 0.16);
        }
        .form-panel .form-actions .btn-cancel {
            background: #f1f5f9;
            color: #475569;
        }
        .form-panel .form-actions .btn-save:hover {
            transform: translateY(-1px);
            background: #184862;
        }
        .form-panel .form-actions .btn-cancel:hover {
            background: #e2e8f0;
        }

        /* ---------- Cards ---------- */
        .cards-grid {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .card {
            background: #fbfdff;
            border-radius: 20px;
            padding: 1.5rem 1.8rem;
            box-shadow: 0 12px 34px rgba(33, 59, 80, 0.08);
            transition: all 0.25s ease;
            border-right: 6px solid #cbd5e1;
            position: relative;
        }
        .card:hover {
            box-shadow: 0 16px 48px rgba(33, 59, 80, 0.12);
            transform: translateY(-1px);
        }
        .card.priority-high {
            border-right-color: #dc2626;
        }
        .card.priority-medium {
            border-right-color: #f59e0b;
        }
        .card.priority-low {
            border-right-color: #10b981;
        }
        .card.priority-none {
            border-right-color: #94a3b8;
        }
        .card.resolved {
            opacity: 0.84;
            background: #f6f8fb;
        }
        .card.resolved .card-header .title {
            text-decoration: line-through;
            text-decoration-color: #94a3b8;
        }

        .card-edit-form {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            margin-top: 0;
        }
        .card-edit-form.open {
            max-height: 900px;
            opacity: 1;
            margin-top: 1rem;
        }
        .card-edit-form .edit-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .card-edit-form .edit-grid.full {
            grid-template-columns: 1fr;
        }
        .card-edit-form label {
            display: block;
            font-size: 0.78rem;
            color: #475569;
            margin-bottom: 0.4rem;
        }
        .card-edit-form input,
        .card-edit-form select,
        .card-edit-form textarea {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            background: #ffffff;
            color: #10243f;
            font-family: inherit;
            font-size: 0.9rem;
            padding: 0.8rem 0.95rem;
            outline: none;
        }
        .card-edit-form textarea {
            min-height: 100px;
            resize: vertical;
        }
        .card-edit-form .actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
        }
        .card-edit-form .actions button {
            border: none;
            border-radius: 999px;
            padding: 0.65rem 1.15rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .card-edit-form .actions .btn-save {
            background: #0f70c2;
            color: #fff;
        }
        .card-edit-form .actions .btn-cancel {
            background: #f1f5f9;
            color: #475569;
        }
        .card-edit-form .actions .btn-save:hover {
            background: #0d639e;
        }
        .card-edit-form .actions .btn-cancel:hover {
            background: #e2e8f0;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 1.5rem 1.8rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: all 0.25s ease;
            border-right: 6px solid #cbd5e1;
            position: relative;
        }
        .card:hover {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }
        .card.priority-high {
            border-right-color: #dc2626;
        }
        .card.priority-medium {
            border-right-color: #f59e0b;
        }
        .card.priority-low {
            border-right-color: #10b981;
        }
        .card.priority-none {
            border-right-color: #94a3b8;
        }
        .card.resolved {
            opacity: 0.7;
            background: #f8fafc;
        }
        .card.resolved .card-header .title {
            text-decoration: line-through;
            text-decoration-color: #94a3b8;
        }

        .card-header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 0.6rem 1rem;
            margin-bottom: 0.5rem;
        }
        .card-header .number {
            font-weight: 700;
            font-size: 0.8rem;
            color: #94a3b8;
            background: #f1f5f9;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            line-height: 1.8;
            white-space: nowrap;
        }
        .card-header .title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f2b4b;
            flex: 1;
            min-width: 180px;
        }
        .card-header .badge {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .badge-high {
            background: #fecaca;
            color: #991b1b;
        }
        .badge-medium {
            background: #fde68a;
            color: #92400e;
        }
        .badge-low {
            background: #a7f3d0;
            color: #065f46;
        }
        .badge-none {
            background: #e2e8f0;
            color: #475569;
        }
        .badge-phase {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem 1.8rem;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 0.8rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px dashed #e2e8f0;
        }
        .card-meta i {
            width: 1.1rem;
            color: #94a3b8;
        }
        .card-meta .module {
            font-weight: 500;
            color: #1e293b;
        }
        .card-meta .func {
            font-family: 'Courier New', monospace;
            background: #f1f5f9;
            padding: 0.1rem 0.7rem;
            border-radius: 12px;
            font-size: 0.8rem;
            color: #1e293b;
        }
        .card-meta .roadmap {
            display: inline-flex;
            gap: 0.35rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .card-meta .roadmap .ref {
            background: #e0f2fe;
            color: #075985;
            padding: 0.12rem 0.65rem;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 600;
        }

        .card-body {
            margin-top: 0.4rem;
        }
        .card-body .problem {
            background: #fef2f2;
            padding: 0.8rem 1.2rem;
            border-radius: 14px;
            border-right: 4px solid #fca5a5;
            margin-bottom: 0.9rem;
            font-size: 0.95rem;
            line-height: 1.7;
        }
        .card-body .problem strong {
            color: #991b1b;
        }
        .card-body .solution {
            background: #f0fdf4;
            padding: 0.8rem 1.2rem;
            border-radius: 14px;
            border-right: 4px solid #6ee7b7;
            margin-bottom: 0.9rem;
            font-size: 0.95rem;
            line-height: 1.7;
        }
        .card-body .solution strong {
            color: #065f46;
        }
        mark.match {
            background: #fde68a;
            color: inherit;
            padding: 0 0.08rem;
            border-radius: 0.2rem;
        }

        /* ---------- Editable Note / Suggestion ---------- */
        .note-area {
            margin-top: 0.8rem;
            background: #f8fafc;
            border-radius: 16px;
            padding: 0.8rem 1.2rem;
            border: 1.5px dashed #d1d5db;
            transition: border 0.2s;
        }
        .note-area:focus-within {
            border-color: #1a3f66;
            background: #fff;
        }
        .note-area .note-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.3rem;
            letter-spacing: 0.3px;
        }
        .note-area .note-label i {
            font-size: 0.8rem;
        }
        .note-area textarea {
            width: 100%;
            border: none;
            background: transparent;
            resize: vertical;
            font-family: inherit;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #1e293b;
            outline: none;
            min-height: 48px;
            padding: 0.2rem 0;
        }
        .note-area textarea::placeholder {
            color: #adb5bd;
            font-weight: 300;
        }

        .card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.8rem;
            align-items: center;
        }
        .card-actions button {
            background: transparent;
            border: none;
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: #64748b;
            border: 1.5px solid transparent;
        }
        .card-actions button:hover {
            background: #f1f5f9;
        }
        .card-actions .btn-resolve {
            color: #10b981;
        }
        .card-actions .btn-resolve:hover {
            background: #ecfdf5;
            border-color: #6ee7b7;
        }
        .card-actions .btn-resolve.resolved {
            color: #f59e0b;
        }
        .card-actions .btn-resolve.resolved:hover {
            background: #fffbeb;
            border-color: #fcd34d;
        }
        .card-actions .btn-edit {
            color: #3b82f6;
        }
        .card-actions .btn-edit:hover {
            background: #eff6ff;
            border-color: #93c5fd;
        }
        .card-actions .btn-suggestion {
            color: #8b5cf6;
        }
        .card-actions .btn-suggestion:hover {
            background: #f5f3ff;
            border-color: #c4b5fd;
        }
        .card-actions .btn-delete {
            color: #dc2626;
        }
        .card-actions .btn-delete:hover {
            background: #fef2f2;
            border-color: #fecaca;
        }
        .card-actions .btn-collapse {
            color: #94a3b8;
            margin-right: auto;
        }
        .card-actions .btn-collapse:hover {
            background: #f1f5f9;
        }

        /* ---------- Collapsible detail ---------- */
        .card-detail {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            margin-top: 0;
        }
        .card-detail.open {
            max-height: 1200px;
            opacity: 1;
            margin-top: 0.8rem;
        }
        .card-detail .detail-inner {
            background: #f1f5f9;
            border-radius: 16px;
            padding: 1rem 1.4rem;
            font-size: 0.92rem;
            line-height: 1.8;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .card-detail .detail-inner strong {
            color: #0f2b4b;
        }

        /* ---------- Toast ---------- */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #0f2b4b;
            color: #fff;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            font-size: 0.9rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast i {
            color: #facc15;

        // ================================================================
        //  STATE
        // ================================================================
        const STORAGE_KEY = 'hamzaban_review_data';

        let issues = [];
        let priorityFilter = 'all';
        let statusFilter = 'all';
        let moduleFilter = 'all';
        let phaseFilter = 'all';
        let roadmapFilter = '';
        let searchQuery = '';
        let sortBy = 'id';
        let sortDirection = 'asc';

        // ================================================================
        //  HELPERS
        // ================================================================
        function normalizeIssue(issue) {
            const status = issue.status || (issue.resolved === true ? 'resolved' : 'open');
            return {
                title: issue.title || '',
                module: issue.module || '—',
                func: issue.func || '—',
                problem: issue.problem || '',
                solution: issue.solution || '',
                priority: issue.priority || 'none',
                note: issue.note || '',
                resolved: status === 'resolved',
                status,
                detailOpen: issue.detailOpen === true,
                editing: issue.editing === true,
                ...issue
            };
        }

        function loadFromStorage(baseIssues = ISSUES_DATA) {
            const stored = localStorage.getItem(STORAGE_KEY);
            const base = Array.isArray(baseIssues) ? baseIssues : ISSUES_DATA;
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    const merged = base.map(d => {
                        const saved = Array.isArray(parsed) ? parsed.find(p => p.id === d.id) : null;
                        return normalizeIssue(saved ? { ...d, ...saved } : { ...d });
                    });
                    const extras = Array.isArray(parsed)
                        ? parsed.filter(p => !base.some(d => d.id === p.id)).map(normalizeIssue)
                        : [];
                    issues = [...merged, ...extras];
                    return;
                } catch (_) { /* fall through */ }
            }
            issues = base.map(d => normalizeIssue({ ...d }));
        }

        function getStatus(issue) {
            return issue.status || (issue.resolved === true ? 'resolved' : 'open');
        }

        function getRoadmapRefs(issue) {
            return Array.isArray(issue.roadmap_refs) ? issue.roadmap_refs.filter(Boolean) : [];
        }

        function getPhase(issue) {
            return String(issue.phase || '').trim();
        }

        function getPhaseLabel(phase) {
            const labels = {
                'phase-1': 'فاز ۱',
                'phase-2': 'فاز ۲',
                'phase-3': 'فاز ۳',
                'phase-4': 'فاز ۴',
                'phase-6': 'فاز ۶'
            };
            return labels[phase] || phase || 'بدون فاز';
        }

        function tokenizeSearch(query) {
            const tokens = [];
            const re = /"([^"]+)"|'([^']+)'|(\S+)/g;
            let match;
            while ((match = re.exec(query || '')) !== null) {
                tokens.push(match[1] || match[2] || match[3]);
            }
            return tokens.filter(Boolean);
        }

        function parseSearchQuery(query) {
            const tokens = tokenizeSearch(query);
            const idFilters = [];
            const terms = [];
            tokens.forEach(token => {
                const lower = token.toLowerCase();
                if (lower.startsWith('id:')) {
                    const value = token.slice(3).trim();
                    if (value) idFilters.push(value);
                } else if (/^#\d+$/.test(token)) {
                    idFilters.push(token.slice(1));
                } else {
                    terms.push(token);
                }
            });
            return { idFilters, terms };
        }

        function issueSearchText(issue) {
            return [
                issue.id,
                issue.title,
                issue.module,
                issue.func,
                issue.problem,
                issue.solution,
                issue.note,
                getStatus(issue),
                getPhase(issue),
                getRoadmapRefs(issue).join(' '),
                issue.evidence,
                issue.last_reviewed
            ]
                .map(value => String(value || '').toLowerCase())
                .join(' ');
        }

        function matchesSearch(issue, parsed) {
            const haystack = issueSearchText(issue);
            if (parsed.idFilters.length) {
                const idText = String(issue.id);
                if (!parsed.idFilters.every(value => idText === value || idText.includes(value))) {
                    return false;
                }
            }
            return parsed.terms.every(term => haystack.includes(term.toLowerCase()));
        }

        function escapeRegExp(text) {
            return String(text).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function highlightText(text, terms) {
            const raw = String(text || '');
            if (!terms.length) return escapeHtml(raw);
            const escaped = escapeHtml(raw);
            const uniqueTerms = [...new Set(terms.filter(Boolean).map(t => t.trim()).filter(Boolean))];
            if (!uniqueTerms.length) return escaped;
            const pattern = uniqueTerms
                .map(term => escapeRegExp(term))
                .sort((a, b) => b.length - a.length)
                .join('|');
            if (!pattern) return escaped;
            const regex = new RegExp(`(${pattern})`, 'gi');
            return escaped.replace(regex, '<mark class="match">$1</mark>');
        }

        function getPriorityRank(priority) {
            const order = { high: 0, medium: 1, low: 2, none: 3 };
            return Object.prototype.hasOwnProperty.call(order, priority) ? order[priority] : 4;
        }

        function getStatusRank(status) {
            const order = { open: 0, partial: 1, resolved: 2, 'accepted-risk': 3, obsolete: 4 };
            return Object.prototype.hasOwnProperty.call(order, status) ? order[status] : 5;
        }

        function compareIssues(a, b) {
            const direction = sortDirection === 'desc' ? -1 : 1;
            const statusA = getStatus(a);
            const statusB = getStatus(b);
            let result = 0;
            switch (sortBy) {
                case 'priority':
                    result = getPriorityRank(a.priority) - getPriorityRank(b.priority);
                    break;
                case 'status':
                    result = getStatusRank(statusA) - getStatusRank(statusB);
                    break;
                case 'module':
                    result = String(a.module || '').localeCompare(String(b.module || ''), 'fa');
                    break;
                case 'title':
                    result = String(a.title || '').localeCompare(String(b.title || ''), 'fa');
                    break;
                case 'id':
                default:
                    result = Number(a.id) - Number(b.id);
                    break;
            }
            if (result === 0) {
                result = Number(a.id) - Number(b.id);
            }
            return result * direction;
        }

        function getFilteredIssues() {
            const parsedSearch = parseSearchQuery(searchQuery);
            return issues.filter(issue => {
                if (priorityFilter !== 'all' && issue.priority !== priorityFilter) return false;
                if (statusFilter !== 'all' && getStatus(issue) !== statusFilter) return false;
                if (moduleFilter !== 'all' && issue.module !== moduleFilter) return false;
                if (phaseFilter !== 'all' && getPhase(issue) !== phaseFilter) return false;
                if (roadmapFilter.trim()) {
                    const refs = getRoadmapRefs(issue);
                    const needle = roadmapFilter.trim().toLowerCase();
                    if (!refs.some(ref => String(ref).toLowerCase().includes(needle))) return false;
                }
                return matchesSearch(issue, parsedSearch);
            }).slice().sort(compareIssues);
        }

        function getAllIssueTerms() {
            return parseSearchQuery(searchQuery).terms;
        }

        function updateModuleFilterOptions() {
            const select = document.getElementById('moduleFilter');
            if (!select) return;
            const selected = select.value || moduleFilter;
            const modules = [...new Set(issues.map(issue => issue.module).filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), 'fa'));
            select.innerHTML = ['<option value="all">همه ماژول‌ها</option>']
                .concat(modules.map(module => `<option value="${escapeHtml(module)}">${escapeHtml(module)}</option>`))
                .join('');
            select.value = modules.includes(selected) ? selected : 'all';
            moduleFilter = select.value;
        }

        function updatePhaseFilterOptions() {
            const select = document.getElementById('phaseFilter');
            if (!select) return;
            const selected = select.value || phaseFilter;
            const phases = [...new Set(issues.map(issue => getPhase(issue)).filter(Boolean))].sort((a, b) => a.localeCompare(b));
            select.innerHTML = ['<option value="all">همه فازها</option>']
                .concat(phases.map(phase => `<option value="${escapeHtml(phase)}">${escapeHtml(getPhaseLabel(phase))}</option>`))
                .join('');
            select.value = phases.includes(selected) ? selected : 'all';
            phaseFilter = select.value;
        }

        function getNextId() {
            return issues.length ? Math.max(...issues.map(i => i.id)) + 1 : 1;
        }

        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(issues));
        }

        function toggleAddCardForm(show) {
            const panel = document.getElementById('addCardForm');
            panel.classList.toggle('open', show);
            if (show) {
                panel.scrollIntoView({ behavior: 'smooth', block: 'start' });

        function clearNewCardForm() {
            document.getElementById('newTitle').value = '';
            document.getElementById('newModule').value = '';
            document.getElementById('newFunc').value = '';
            document.getElementById('newPriority').value = 'medium';
            document.getElementById('newProblem').value = '';

        function insertNewCard() {
            const title = document.getElementById('newTitle').value.trim();
            const module = document.getElementById('newModule').value.trim() || '—';
            const func = document.getElementById('newFunc').value.trim() || '—';
            const priority = document.getElementById('newPriority').value;
            const problem = document.getElementById('newProblem').value.trim();
            const solution = document.getElementById('newSolution').value.trim();

            const newIssue = {

                title,
                module,
                func,
                priority,
                problem,
                solution,
                note: '',
                resolved: false,
                detailOpen: false,
                editing: false
            };

            issues.unshift(newIssue);
            saveToStorage();
            render();
            clearNewCardForm();
            toggleAddCardForm(false);
            showToast('✅ کارت جدید اضافه شد');
        }

        function deleteIssue(id) {
            if (!confirm('آیا مطمئن هستید که این کارت حذف شود؟')) return;
            issues = issues.filter(i => i.id !== id);

        }

        function saveEditForm(id) {

            const module = document.getElementById(`editModule-${id}`).value.trim() || '—';
            const func = document.getElementById(`editFunc-${id}`).value.trim() || '—';

                showToast('عنوان، مشکل و راه‌حل باید پر شوند.');
                return;
            }

            updateIssue(id, {
                title,
                module,
                func,
                priority,
                problem,
                solution,
                editing: false
            });
            showToast('✅ تغییرات کارت ذخیره شد');
        }

        function getPriorityLabel(p) {
            const map = { high: 'بالا', medium: 'متوسط', low: 'پایین', none: '—' };
            return map[p] || p;
        }

        function getPriorityBadgeClass(p) {
            return 'badge-' + p;
        }

        function getCardPriorityClass(p) {
            return 'priority-' + p;
        }

        function getIssueById(id) {
            return issues.find(i => i.id === id);
        }

        function updateIssue(id, updates) {
            const idx = issues.findIndex(i => i.id === id);
            if (idx === -1) return;
            issues[idx] = { ...issues[idx], ...updates };
            saveToStorage();
            render();
        }

            const empty = document.getElementById('emptyState');
            updateModuleFilterOptions();
            updatePhaseFilterOptions();

            const parsedSearch = parseSearchQuery(searchQuery);
            const filtered = getFilteredIssues();

            // Update stats
            const total = issues.length;
            const high = issues.filter(i => i.priority === 'high').length;
            const medium = issues.filter(i => i.priority === 'medium').length;
            const low = issues.filter(i => i.priority === 'low').length;
            const resolved = issues.filter(i => i.resolved === true).length;
            const visible = filtered.length;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('highCount').textContent = high;
            document.getElementById('mediumCount').textContent = medium;
            document.getElementById('lowCount').textContent = low;
            document.getElementById('resolvedCount').textContent = resolved;
            const resultsSummary = document.getElementById('resultsSummary');
            if (resultsSummary) {

                    high: 'بالا',
                    medium: 'متوسط',
                    low: 'پایین',

                };
                const statusLabels = {
                    open: 'باز',
                    partial: 'نسبتاً حل‌شده',

                    'accepted-risk': 'ریسک پذیرفته‌شده',
                    obsolete: 'منسوخ'
                };
                if (priorityFilter !== 'all') filters.push(`فیلتر: ${priorityLabels[priorityFilter] || priorityFilter}`);
                if (statusFilter !== 'all') filters.push(`وضعیت: ${statusLabels[statusFilter] || statusFilter}`);
                if (moduleFilter !== 'all') filters.push(`ماژول: ${moduleFilter}`);

                if (parsedSearch.idFilters.length) filters.push(`ID: ${parsedSearch.idFilters.join(', ')}`);
                if (parsedSearch.terms.length) filters.push(`جستجو: ${parsedSearch.terms.join(' ')}`);

            // Copy (clipboard) buttons (per-card)
            function copyToClipboard(text) {
                if (!text) return Promise.reject('Empty');
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(text);
                }
                return new Promise((resolve, reject) => {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    try {
                        document.execCommand('copy');
                        resolve();
                    } catch (e) {
                        reject(e);
                    } finally {
                        ta.remove();
                    }
                });
            }

            document.querySelectorAll('.btn-copy-md').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();

                    const md = buildIssueMarkdown(issue);
                    copyToClipboard(md).then(() => {

            document.querySelectorAll('#filterGroup button').forEach(btn => {

        // ================================================================
        //  UTILITY
        // ================================================================
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        let toastTimeout;

        function showToast(msg) {
            const el = document.getElementById('toast');
            const msgEl = document.getElementById('toastMessage');
            msgEl.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                el.classList.remove('show');
            }, 2200);
        }

                // ================================================================
                //  EXPORT HELPERS
                // ================================================================
                function buildIssueMarkdown(issue) {
                    const lines = [];
                    lines.push(`# ${issue.title}`);
                    lines.push('');
                    lines.push(`- ID: ${issue.id}`);
                    lines.push(`- Module: ${issue.module}`);
                    if (issue.func && issue.func !== '—') lines.push(`- Function: ${issue.func}`);
                    lines.push(`- Status: ${getStatus(issue)}`);
                    lines.push(`- Priority: ${getPriorityLabel(issue.priority)}`);
                    if (issue.phase) lines.push(`- Phase: ${getPhaseLabel(issue.phase)}`);
                    const refs = getRoadmapRefs(issue);
                    if (refs.length) lines.push(`- Roadmap refs: ${refs.join(', ')}`);
                    if (issue.evidence) lines.push(`- Evidence: ${issue.evidence}`);
                    if (issue.last_reviewed) lines.push(`- Last reviewed: ${issue.last_reviewed}`);
                    lines.push('');
                    lines.push('## Problem');
                    lines.push(issue.problem || '');
                    lines.push('');
                    lines.push('## Solution');
                    lines.push(issue.solution || '');
                    if (issue.note) {
                        lines.push('');
                        lines.push('## Note');
                        lines.push(issue.note);
                    }
                    return lines.join('\n');
                }

                function downloadFile(filename, content, mime) {
                    const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                }

                function exportIssueMD(id) {
                    const issue = getIssueById(id);
                    if (!issue) { showToast('کارت پیدا نشد'); return; }
                    const md = buildIssueMarkdown(issue);
                    downloadFile(`issue-${id}.md`, md, 'text/markdown;charset=utf-8');
                    showToast('⬇️ خروجی Markdown دانلود شد');
                }

                function exportIssueJSON(id) {
                    const issue = getIssueById(id);
                    if (!issue) { showToast('کارت پیدا نشد'); return; }
                    const json = JSON.stringify(issue, null, 2);
                    downloadFile(`issue-${id}.json`, json, 'application/json;charset=utf-8');
                    showToast('⬇️ خروجی JSON دانلود شد');
                }

                function exportAllMD() {
                    const all = issues.slice().sort(compareIssues);
                    const parts = [];
                    parts.push('# HamZaban — Issues Export');
                    parts.push('');
                    all.forEach((issue, idx) => {
                        parts.push(buildIssueMarkdown(issue));
                        if (idx < all.length - 1) parts.push('\n---\n');
                    });
                    const content = parts.join('\n');
                    downloadFile('hamzaban-issues.md', content, 'text/markdown;charset=utf-8');
                    showToast('⬇️ فایل Markdown همه کارت‌ها دانلود شد');
                }

                function exportAllJSON() {
                    const data = JSON.stringify(issues.slice().sort(compareIssues), null, 2);
                    downloadFile('hamzaban-issues.json', data, 'application/json;charset=utf-8');
                    showToast('⬇️ فایل JSON همه کارت‌ها دانلود شد');
                }

                function exportFilteredMD() {
                    const all = getFilteredIssues();

                    parts.push(`# HamZaban — Issues Export (${all.length})`);
                    parts.push('');

                        if (idx < all.length - 1) parts.push('\n---\n');

                function exportFilteredJSON() {

                    showToast('⬇️ فایل JSON فیلتر فعلی دانلود شد');

        // ================================================================
        //  INIT
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            // Try to load `issues.json` from disk via fetch (works when served over http://localhost).
            // If fetch fails (e.g. opened via file:// or CORS), fall back to localStorage or embedded data.
            fetch('./issues.json')
                .then(resp => {
                    if (!resp.ok) throw new Error('no-data');
                    return resp.json();
                })
                .then(parsed => {
                    if (Array.isArray(parsed)) {
                        loadFromStorage(parsed);
                    } else if (parsed && Array.isArray(parsed.issues)) {
                        loadFromStorage(parsed.issues);
                    } else {
                        loadFromStorage();
                    }
                    render();
                })
                .catch(err => {
                    // fallback
                    loadFromStorage();
                    render();
                    // Friendly hint when page opened via file:// which prevents fetch of local files in some browsers
                    if (location.protocol === 'file:') {
                        const hint = document.createElement('div');
                        hint.style.cssText = 'background:#fff3bf;border:1px solid #f1c40f;padding:8px 12px;border-radius:8px;margin:8px 0;font-size:0.95rem;color:#664d03;';
                        hint.innerHTML = 'توجه: برای خواندن خودکار <strong>issues/issues.json</strong> بهتر است صفحه را با یک سرور محلی باز کنید. در ریشهٔ پروژه اجرا کنید: <code>python -m http.server 8000</code> و سپس <a href="http://localhost:8000/issues/issues.html">http://localhost:8000/issues/issues.html</a> را باز کنید.';
                        const container = document.querySelector('.container');
                        if (container) container.insertBefore(hint, container.firstChild);
                    }
                });

            // Filter buttons
            document.querySelectorAll('#filterGroup button').forEach(btn => {
                btn.addEventListener('click', function() {
                    priorityFilter = this.dataset.filter;
                    render();

            // Search
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', function() {
                searchQuery = this.value;
                render();
            });
            const clearSearchBtn = document.getElementById('clearSearchBtn');

                searchQuery = '';

                roadmapFilter = this.value;

            const sortBySelect = document.getElementById('sortBy');
            if (sortBySelect) sortBySelect.addEventListener('change', function() {
                sortBy = this.value;

            const sortDirectionBtn = document.getElementById('sortDirectionBtn');
            if (sortDirectionBtn) sortDirectionBtn.addEventListener('click', function() {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
                render();
            });

            const jumpToIdInput = document.getElementById('jumpToIdInput');
            const jumpToIdBtn = document.getElementById('jumpToIdBtn');
            const jumpToIssue = function() {
                const id = parseInt(jumpToIdInput.value, 10);
                if (!id) {
                    showToast('ID معتبر نیست');
                    return;
                }
                if (!issues.some(issue => Number(issue.id) === id)) {
                    showToast('کارت با این ID پیدا نشد');

                searchQuery = `id:${id}`;
                document.getElementById('searchInput').value = searchQuery;
                document.getElementById('statusFilter').value = 'all';
                document.getElementById('moduleFilter').value = 'all';
                document.getElementById('phaseFilter').value = 'all';
                document.getElementById('roadmapFilter').value = '';
                render();
                const card = document.querySelector(`.card[data-id="${id}"]`);
                if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            };
            if (jumpToIdBtn) jumpToIdBtn.addEventListener('click', jumpToIssue);
            if (jumpToIdInput) jumpToIdInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') jumpToIssue();
            });

            // Reset storage
            document.getElementById('resetStorageBtn').addEventListener('click', function() {
                if (confirm('آیا مطمئنید که می‌خواهید همه تغییرات (یادداشت‌ها، وضعیت حل‌شدن و ...) را بازنشانی کنید؟')) {
                    localStorage.removeItem(STORAGE_KEY);
                    loadFromStorage();
                    render();
                    showToast('🔄 همه تغییرات بازنشانی شد');
                }
            });

            document.getElementById('addCardBtn').addEventListener('click', function() {
                const form = document.getElementById('addCardForm');
                const isOpen = form.classList.contains('open');
                if (isOpen) {
                    toggleAddCardForm(false);
                } else {
                    toggleAddCardForm(true);
                }
            });

            // Export all buttons
            const exportAllMdBtn = document.getElementById('exportAllMdBtn');
            if (exportAllMdBtn) exportAllMdBtn.addEventListener('click', exportAllMD);
            const exportAllJsonBtn = document.getElementById('exportAllJsonBtn');
            if (exportAllJsonBtn) exportAllJsonBtn.addEventListener('click', exportAllJSON);
            const exportFilteredMdBtn = document.getElementById('exportFilteredMdBtn');
            if (exportFilteredMdBtn) exportFilteredMdBtn.addEventListener('click', exportFilteredMD);
            const exportFilteredJsonBtn = document.getElementById('exportFilteredJsonBtn');
            if (exportFilteredJsonBtn) exportFilteredJsonBtn.addEventListener('click', exportFilteredJSON);

            // Copy all buttons
            const copyAllMdBtn = document.getElementById('copyAllMdBtn');
            if (copyAllMdBtn) copyAllMdBtn.addEventListener('click', function() {
                const all = issues.slice().sort(compareIssues);
                const parts = ['# HamZaban — Issues Export', ''];
                all.forEach((issue, idx) => {
                    parts.push(buildIssueMarkdown(issue));
                    if (idx < all.length - 1) parts.push('\n---\n');
                });
                const md = parts.join('\n');
                copyToClipboard(md).then(() => {
                    if (confirm('همه متن‌ها به کلیپ‌بورد کپی شد. آیا می‌خواهید فایل Markdown نیز ذخیره شود؟')) {
                        const name = prompt('نام فایل را وارد کنید:', 'hamzaban-issues.md');
                        if (name) downloadFile(name, md, 'text/markdown;charset=utf-8');
                    }
                    showToast('⬇️ همه متن‌ها کپی شد');
                }).catch(() => showToast('کپی در کلیپ‌بورد ناموفق بود'));
            });

            const copyAllJsonBtn = document.getElementById('copyAllJsonBtn');
            if (copyAllJsonBtn) copyAllJsonBtn.addEventListener('click', function() {
                const data = JSON.stringify(issues.slice().sort(compareIssues), null, 2);
                copyToClipboard(data).then(() => {
                    if (confirm('JSON همه کارت‌ها به کلیپ‌بورد کپی شد. آیا می‌خواهید فایل JSON نیز ذخیره شود؟')) {
                        const name = prompt('نام فایل را وارد کنید:', 'hamzaban-issues.json');
                        if (name) downloadFile(name, data, 'application/json;charset=utf-8');
                    }
                    showToast('⬇️ JSON همه کارت‌ها کپی شد');
                }).catch(() => showToast('کپی در کلیپ‌بورد ناموفق بود'));
            });

            // Import (file input)
            const importInput = document.getElementById('importFileInput');
            if (importInput) {
                importInput.addEventListener('change', function(e) {
                    const f = this.files && this.files[0];
                    if (!f) return;
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const text = ev.target.result;
                        const name = f.name || '';
                        if (name.endsWith('.json') || f.type === 'application/json') {
                            try {
                                const parsed = JSON.parse(text);
                                handleImportedJSON(parsed);
                            } catch (err) { showToast('فایل JSON نامعتبر است'); }
                        } else {
                            // Treat as Markdown: create single issue with content
                            const title = (text.split('\n')[0] || 'Imported Issue').replace(/^#\s*/, '').trim();
                            const newIssue = {
                                id: getNextId(),
                                title,
                                module: 'import.md',
                                func: '—',
                                priority: 'none',
                                problem: text,
                                solution: '',
                                note: '',
                                resolved: false
                            };
                            issues.unshift(normalizeIssue(newIssue));
                            saveToStorage();
                            render();
                            showToast('MD وارد شد و به عنوان کارت اضافه شد');
                        }
                    };
                    reader.readAsText(f, 'utf-8');
                    // reset input
                    this.value = '';
                });
            }

            function handleImportedJSON(parsed) {
                if (Array.isArray(parsed)) {
                    const replace = confirm('فایل شامل آرایه‌ای از کارت‌هاست. آیا مایلید تمام داده‌ها جایگزین شوند؟ (Cancel برای الحاق)');
                    if (replace) {
                        issues = parsed.map(normalizeIssue);
                        saveToStorage();
                        render();
                        showToast('داده‌ها جایگزین شد');
                        return;
                    }
                    // merge: append new ones, avoid id collisions
                    const existingIds = new Set(issues.map(i => i.id));
                    parsed.forEach(item => {
                        const it = normalizeIssue(item);
                        if (!it.id || existingIds.has(it.id)) it.id = getNextId();
                        issues.push(it);
                    });
                    saveToStorage();
                    render();
                    showToast('داده‌ها الحاق شد');
                } else if (parsed && typeof parsed === 'object') {
                    // single issue object or envelope
                    if (parsed.issues && Array.isArray(parsed.issues)) {
                        handleImportedJSON(parsed.issues);
                        return;
                    }
                    const it = normalizeIssue(parsed);
                    it.id = getNextId();
                    issues.unshift(it);
                    saveToStorage();
                    render();
                    showToast('کارت تک وارد شد');
                } else {
                    showToast('فرمت فایل نامعتبر است');
                }
            }

            document.getElementById('saveNewCardBtn').addEventListener('click', function(e) {
                e.preventDefault();
                insertNewCard();
            });

            document.getElementById('cancelNewCardBtn').addEventListener('click', function(e) {
                e.preventDefault();
                clearNewCardForm();
                toggleAddCardForm(false);
            });

            // Keyboard shortcut: Ctrl+F to focus search
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                    e.preventDefault();
                    document.getElementById('searchInput').focus();
                }
            });
        });
    </script>

</body>
</html>
